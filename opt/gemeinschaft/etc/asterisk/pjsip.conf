; PJSIP settings of Gemeinschaft.
;
; Phones are not defined here: their endpoint, auth and aor objects come
; from the database views ps_endpoints, ps_auths and ps_aors (see
; sorcery.conf and extconfig.conf).

[global]
type = global
default_realm = gemeinschaft.local
user_agent = Asterisk Gemeinschaft

[transport-udp]
type = transport
protocol = udp
tos = cs3
#exec /opt/gemeinschaft/etc/asterisk/bindaddr.conf.php pjsip
