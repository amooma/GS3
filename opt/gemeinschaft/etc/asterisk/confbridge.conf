; Conferences. The options replace MeetMe's "c", "o" and "T".

[gs_conf_bridge]
type = bridge

[gs_conf_user]
type = user
announce_user_count = yes
dsp_drop_silence = yes
talk_detection_events = yes
music_on_hold_when_empty = yes   ; a caller alone in the room hears music
music_on_hold_class = default
