# $Revision$

KeepAlive On
MaxKeepAliveRequests 50
KeepAliveTimeout 60
Timeout 100

<Directory "/var/www">
	AllowOverride All
</Directory>

# apache2.service has MemoryDenyWriteExecute=yes, so the PCRE JIT
# cannot allocate memory and PHP prints a warning into the page.
<IfModule php_module>
	php_admin_flag pcre.jit off
</IfModule>
